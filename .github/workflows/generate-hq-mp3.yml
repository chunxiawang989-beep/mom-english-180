name: 生成高品质MP3（免Azure）

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "先生成Day1试听；满意后再生成全部"
        required: true
        default: "day1"
        type: choice
        options:
          - day1
          - all
      voice:
        description: "美音女声；auto会自动选择可用的优质en-US女声"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - en-US-AvaNeural
          - en-US-JennyNeural
          - en-US-AriaNeural

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      SCOPE: ${{ inputs.scope }}
      VOICE: ${{ inputs.voice }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Edge TTS
        run: pip install edge-tts==7.2.8

      - name: Generate static MP3 files
        run: python3 scripts/generate_hq_audio.py

      - name: Verify generated MP3 files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path("hq_audio").glob("*.mp3"))
          if not files:
              raise SystemExit("No MP3 generated")
          bad = [str(p) for p in files if p.stat().st_size < 1500]
          if bad:
              raise SystemExit("Invalid MP3 files: " + str(bad[:10]))
          print("Verified MP3 files:", len(files))
          PY

      - name: Commit actual MP3 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hq_audio hq-audio-map.js
          git diff --cached --quiet && exit 0
          git commit -m "Generate static natural American English MP3 audio"
          git push
